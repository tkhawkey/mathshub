<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap">
<style>
  :root {
    --paper: #F0EBFB;
    --card: #FFFFFF;
    --ink: #002199;
    --ink-soft: #3D56B5;
    --brand: #002199;
    --brand-soft: #E9E0F9;
    --accent: #05951A;
    --accent-ink: #FFFFFF;
    --correct: #05951A;
    --correct-bg: #DDF5E1;
    --wrong: #C21E3A;
    --wrong-bg: #FBE6EA;
    --border: #C4AEEF;
    --shadow: none;
    --focus: #9973E4;
  
    --accent-soft: #DDF5E1;
    --cis-blue: #002199;
    --cis-blue-shade-1: #001A7A;
    --cis-blue-shade-3: #000D3D;
    --cis-lavender: #DACCF5;
    --cis-lavender-tint-3: #F0EBFB;
    --cis-green: #06B820;
    --cis-green-shade-1: #05951A;
    --cis-green-shade-2: #047314;
    --cis-green-tint-3: #49E05F;
    --font-brand: 'Sitka Text', 'Source Serif 4', Georgia, serif;
    --font-head: 'Sitka Heading', 'Sitka Text', 'Source Serif 4', Georgia, serif;
}
  
  

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-brand);
    min-height: 100vh;
    line-height: 1.5;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: clamp(20px, 3vw, 44px) clamp(16px, 4vw, 40px) 60px;
  }

  header.hero { margin-bottom: 28px; }

  .masthead {
    background: var(--brand);
    color: #fff;
    border-radius: 10px;
    padding: 22px 26px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 700;
    margin: 0;
    letter-spacing: 0;
    color: #fff;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 16px;
    margin: 0;
    max-width: 60ch;
  }

  .group { margin-bottom: 36px; }

  .group-title {
    font-family: var(--font-head);
    font-size: clamp(19px, 4vw, 24px);
    font-weight: 700;
    margin: 0 0 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
    color: var(--ink);
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    position: relative;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 26px 22px 22px;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    transition: border-color .15s ease, transform .1s ease;
  }
  .card:hover { border-color: var(--brand); transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .card .tab {
    position: absolute;
    top: -13px;
    left: 20px;
    background: var(--brand);
    color: #fff;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    padding: 3px 12px;
    border-radius: 5px;
  }

  .card h2 {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    margin: 6px 0 10px;
  }

  .card p {
    font-size: 14.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
    line-height: 1.5;
  }

  .card .open-hint {
    font-family: var(--font-brand);
    font-weight: 700;
    font-size: 13px;
    color: var(--brand);
  }

  /* motif matching the number-line archetype, used generically as a card icon */
  .motif {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    padding-top: 6px;
    opacity: 0.75;
    max-width: 220px;
    margin-bottom: 4px;
  }
  .motif::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 12px;
    height: 2px;
    background: var(--ink);
  }
  .motif .m-tick { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .motif .m-mark { width: 2px; height: 10px; background: var(--ink); margin-top: 7px; }
  .motif .m-label { font-family: var(--font-head); font-size: 10px; color: var(--ink); font-weight: 700; }
  .motif .m-label.blank { color: var(--ink-soft); font-weight: 400; }

  .icon-row {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .icon-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 10px;
  }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 16, 24, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-backdrop.hidden { display: none; }

  .modal {
    position: relative;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 30px 26px 26px;
    max-width: 460px;
    width: 100%;
  }

  .modal .tab {
    position: absolute;
    top: -13px;
    left: 20px;
    background: var(--brand);
    color: #fff;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    padding: 3px 12px;
    border-radius: 5px;
  }

  .modal h2 {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 12px;
  }

  .modal p {
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.55;
    margin: 0 0 22px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .primary-btn {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 16px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 13px 26px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .primary-btn:hover { filter: brightness(1.05); }
  .primary-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .ghost-btn {
    font-family: var(--font-brand);
    font-weight: 700;
    font-size: 14px;
    background: transparent;
    color: var(--brand);
    border: 2px solid var(--brand);
    padding: 12px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ghost-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .ghost-btn:hover { background: var(--brand-soft); }

  footer.note {
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 34px;
  }

  /* ===================================================================
     Cambridge International School brand layer
     Flat colour, blue text, pill buttons, 2px blue outlines, serif type.
     Fonts: Sitka (installed with Windows) with Source Serif 4 as fallback.
     Only weights 400 and 700 are used. No shadows, no gradients.
     =================================================================== */
  body {
    background: var(--paper);
    font-family: var(--font-brand);
    font-variant-numeric: lining-nums;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  h1, h2, h3, legend, .tab, .stat .num { font-family: var(--font-head); }
  .equation, .stat .num { font-variant-numeric: lining-nums tabular-nums; }
  a { text-underline-offset: 2px; }

    background-repeat: no-repeat;
    background-size: auto 175%;
    background-position: right 24px top -26px;
    color: #fff;
    border-radius: 8px;
    padding: 20px 24px;
    min-height: 92px;
    display: flex;
    align-items: center;
  }
  .masthead.no-lion { background-image: none; }
  h1 {
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.1;
    color: #fff;
    padding-right: 120px;
  }
  .masthead.no-lion h1 { padding-right: 0; }
  .subtitle { color: var(--ink); }

  /* cards and panels: white, 2px blue outline, 8px radius, flat */
  .panel, .card, .modal, .stat {
    border: 2px solid var(--brand);
    border-radius: 8px;
    box-shadow: none;
  }
  .panel, .card, .modal { background: var(--card); }
  .tab {
    background: var(--brand);
    color: #fff;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 700;
    font-size: 12px;
  }
  .card { transition: background .2s cubic-bezier(.2,.7,.2,1); }
  .card:hover { border-color: var(--brand); transform: none; background: var(--cis-lavender-tint-3); }
  .card:active { transform: scale(0.98); }
  .group-title {
    font-weight: 400;
    color: var(--ink);
    border-bottom: 2px solid var(--brand);
    letter-spacing: 0;
  }
  .card h2, .modal h2 { font-weight: 700; letter-spacing: 0; }
  .open-hint { color: var(--cis-green-shade-1); text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }

  /* buttons: full pills. Primary = green fill + white bold text + trailing > */
  .primary-btn {
    font-family: var(--font-brand);
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border: 2px solid var(--accent);
    border-radius: 999px;
    padding: 12px 28px;
    transition: background .2s cubic-bezier(.2,.7,.2,1), transform .12s;
  }
  .primary-btn::after { content: "\00a0\00a0>"; }
  .primary-btn:hover { filter: none; background: var(--cis-green-shade-2); border-color: var(--cis-green-shade-2); }
  .primary-btn:active { transform: scale(0.97); }
  .primary-btn:disabled { opacity: .45; }
  .ghost-btn, .home-link {
    font-family: var(--font-brand);
    font-weight: 700;
    color: var(--brand);
    background: transparent;
    border: 2px solid var(--brand);
    border-radius: 999px;
    transition: background .2s cubic-bezier(.2,.7,.2,1), transform .12s;
  }
  .ghost-btn:hover, .home-link:hover { background: var(--cis-lavender-tint-3); }
  .ghost-btn:active { transform: scale(0.97); }
  .pill {
    font-family: var(--font-brand);
    font-weight: 700;
    border: 2px solid var(--brand);
    background: #fff;
    color: var(--brand);
  }
  .pill:hover { background: var(--cis-lavender-tint-3); border-color: var(--brand); }
  .pill.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .home-link { text-decoration: none; }

  /* inputs */
  input[type="text"], input[type="number"], input:not([type]), .eq-input, select {
    font-family: var(--font-brand);
    border-color: var(--brand);
    color: var(--ink);
  }
  *:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* modal backdrop uses Cambridge Blue shade 03, not black */
  .modal-backdrop { background: rgba(0, 13, 61, 0.65); }

  /* the school logo on the hub page */
  .school-logo { display: block; width: 240px; max-width: 70%; height: auto; margin: 0 0 20px; }

  footer.note { color: var(--ink-soft); }
  /* keep every card's content top-aligned, whatever the card height */
  .card { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; }
  .card .open-hint { margin-top: auto; }
</style>
</head>

        <div class="icon-dot" style="background:#dd5137;">?</div>
        <div class="icon-dot" style="background:#3a9e53;">100</div>
      </div>
      <h2>Missing Numbers</h2>
      <p>Find the missing number in a pair of equal calculations by spotting how one number changes to make the other.</p>
      <span class="open-hint">Tap to find out more &gt;</span>
    </button>

    </div>
  </div>

  <div class="group">
    <h2 class="group-title">Multiplication &amp; Division</h2>
    <div class="card-grid">

    <button class="card" data-resource="multiples">
      <span class="tab">Multiples</span>
      <div class="icon-row" aria-hidden="true">
        <div class="icon-dot" style="background:#002199;">3</div>
        <div class="icon-dot" style="background:#05951A;">6</div>
        <div class="icon-dot" style="background:#002199;">9</div>
        <div class="icon-dot" style="background:#05951A;">12</div>
      </div>
      <h2>Multiples &amp; Common Multiples</h2>
      <p>Explore multiples on a hundred square, then practise finding multiples, common multiples and the smallest common multiple.</p>
      <span class="open-hint">Tap to find out more &gt;</span>
    </button>

    <button class="card" data-resource="factors">
      <span class="tab">Factors</span>
      <div class="icon-row" aria-hidden="true">
        <div class="icon-dot" style="background:#002199;">1</div>
        <div class="icon-dot" style="background:#05951A;">2</div>
        <div class="icon-dot" style="background:#002199;">4</div>
        <div class="icon-dot" style="background:#05951A;">8</div>
      </div>
      <h2>Factors &amp; Common Factors</h2>
      <p>Use counters to find the factors of a number, then practise listing factors and common factors.</p>
      <span class="open-hint">Tap to find out more &gt;</span>
    </button>

    </div>
  </div>

  <footer class="note">Click a resource to see how it works before you start.</footer>
</div>

<!-- Modal -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <span class="tab">How to use this resource</span>
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button class="ghost-btn" id="modal-back">Back</button>
      <a class="primary-btn" id="modal-start" href="#">Start</a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var RESOURCES = {
    "number-line": {
      title: "Number Line Detective",
      body: "You'll see a number line with the start and end numbers given, but the points in between are missing. Work out the difference between the start and end values, then divide that difference by the number of intervals. Use that to find every missing label. You can reveal each answer and mark whether you got it right, or type the numbers in and check them all at the end.",
      href: "labeling_number_lines.html"
    },
    "place-value": {
      title: "Place Value Practice",
      body: "A calculation like 4,300 + 200 will appear above a place value chart full of counters. Try to work out the answer before the timer runs out — then watch the counters combine or exchange (carrying and borrowing) to show you how the answer is made.",
      href: "place_value_practice.html"
    },
    "number-words": {
      title: "Number Words",
      body: "A number will appear on screen. Say it out loud the way you'd read it or write it down in words, then press “Show in Words” to check whether you were right. Press Generate New Number for another go.",
      href: "place_value_words.html"
    },
    "rounding": {
      title: "Rounding Practice",
      body: "You'll be asked to round a number to the nearest 10, 100 or 1,000. Type your answer in the box, then press Reveal — a number line will build up step by step to show you the two nearest multiples, exactly where your number sits between them, and which one it rounds to.",
      href: "rounding_practice.html"
    },
    "rounding-steps": {
      title: "Rounding: Step by Step",
      body: "This one isn't a quiz — it's a teaching tool. Pick a rounding degree, then press Next to watch the method unfold: circle the digit you're rounding to, underline the next digit along, decide whether to add 1 (5 or more) or leave it alone (4 or less), then turn everything after it into zeros.",
      href: "rounding_steps_demo.html"
    },
    "fact-families": {
      title: "Fact Families",
      body: "Choose addition & subtraction or multiplication & division, and a difficulty level. You'll be given one fact — say 23 + 34 = 57 — and need to fill in the other three number sentences in the same family: the turnaround fact and the two subtraction (or division) facts it unlocks. The two inverse facts can go in either box.",
      href: "fact_families.html"
    },
    "estimating-rounding": {
      title: "Estimating with Rounding",
      body: "You'll see an addition or subtraction calculation with numbers up to 5 digits. Round both numbers to the same degree — either the nearest 1,000 or the nearest 100, your choice — and fill in the three boxes with your rounded numbers and the answer you get from them. It's an estimate, so there's no need to work out the exact answer.",
      href: "estimating_rounding.html"
    },
    "column-method": {
      title: "Column Addition & Subtraction",
      body: "A column grid appears with your calculation already set out, just like in your maths book. Write your answer in the big boxes, and use the small boxes for your own working — carries for addition, exchanges for subtraction — leaving them blank for any column that doesn't need one. Press Check to see how you did, with a full column-by-column worked example if you get it wrong.",
      href: "column_method.html"
    },
    "missing-numbers": {
      title: "Missing Numbers",
      body: "You'll see two calculations joined by an equals sign, with one number missing. Look for numbers that are close to each other, like 98 and 100. In an addition, if one number goes up the other goes down by the same amount so the total stays the same. In a subtraction, both numbers change by the same amount so the difference stays the same. Use the hint and the picture if you get stuck, and type the missing number.",
      href: "missing_numbers.html"
    },
    "multiples": {
      title: "Multiples & Common Multiples",
      body: "Start with Explore: choose a number and its multiples are shaded on a hundred square. Add a second number to see which multiples they share, then step through the method for finding the smallest common multiple. Switch to Practise for questions: spot multiples, complete number tracks, list multiples, and find common multiples. A hint and a hundred square are there if you need them.",
      href: "multiples.html"
    },
    "factors": {
      title: "Factors & Common Factors",
      body: "Start with Explore: choose a number and use the rows button to arrange its counters. When every row is full and nothing is left over, you have found a pair of factors. Compare two numbers to see their common factors. Switch to Practise for questions: list the factors of a number, find common factors and the greatest common factor, or decide if one number is a factor of another.",
      href: "factors.html"
    }
  };

  var backdrop = document.getElementById("modal-backdrop");
  var titleEl = document.getElementById("modal-title");
  var bodyEl = document.getElementById("modal-body");
  var startBtn = document.getElementById("modal-start");
  var backBtn = document.getElementById("modal-back");
  var lastTrigger = null;

  function openModal(key) {
    var resource = RESOURCES[key];
    if (!resource) return;
    titleEl.textContent = resource.title;
    bodyEl.textContent = resource.body;
    startBtn.setAttribute("href", resource.href);
    backdrop.classList.remove("hidden");
    backBtn.focus();
  }

  function closeModal() {
    backdrop.classList.add("hidden");
    if (lastTrigger) lastTrigger.focus();
  }

  document.querySelectorAll(".card").forEach(function (card) {
    card.addEventListener("click", function () {
      lastTrigger = card;
      openModal(card.dataset.resource);
    });
  });

  backBtn.addEventListener("click", closeModal);

  backdrop.addEventListener("click", function (e) {
    if (e.target === backdrop) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !backdrop.classList.contains("hidden")) closeModal();
  });
})();
</script>
</body>
</html>
